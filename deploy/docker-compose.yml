name: tempest

services:
  tempest-ema:
    container_name: tempest-ema
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks:
      - tempest-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tempest-net:
    name: tempest-net
    driver: bridge
