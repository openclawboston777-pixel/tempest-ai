name: tempest

services:
  tempest-ema:
    container_name: tempest-ema
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks:
      - tempest-net
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  tempest-net:
    name: tempest-net
    driver: bridge
